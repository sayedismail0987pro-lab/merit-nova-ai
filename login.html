
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Merit Nova AI</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <!-- BRAND -->
            <div class="login-logo">M✦</div>

            <h1>Merit Nova AI</h1>

            <h2>Welcome Back!</h2>

            <p class="login-description">
                Sign in to continue your intelligent learning journey.
            </p>

            <!-- GOOGLE LOGIN -->
            <button type="button" class="social-button google-button"
                    id="googleLogin">
                <span class="google-icon">G</span>
                Continue with Google
            </button>

            <!-- APPLE LOGIN -->
            <button type="button" class="social-button apple-button"
                    id="appleLogin">
                <span class="apple-icon">●</span>
                Continue with Apple
            </button>

            <!-- DIVIDER -->
            <div class="login-divider">
                <span>OR</span>
            </div>

            <!-- EMAIL LOGIN -->
            <form id="loginForm">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="login-options">

                    <label class="show-password">
                        <input type="checkbox" id="showPassword">
                        Show Password
                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="login-button">
                    Continue with Email
                </button>

            </form>

            <!-- SIGNUP -->
            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

            <p class="login-footer">
                By continuing, you agree to Merit Nova AI's
                Terms and Privacy Policy.
            </p>

        </div>

    </main>

    <script src="login.js"></script>

</body>
</html>
